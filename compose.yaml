# Deploy: see README, section "Deploy". SECRET_KEY comes from .env next to this file.
services:
  web:
    build: .
    image: rock-paper-scissors:current
    restart: unless-stopped
    env_file: .env
    environment:
      RPS_SECURE_COOKIE: "1"
    ports:
      - "127.0.0.1:3060:8000"
    volumes:
      - score-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  score-data:
