<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors 3D</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script type="importmap">
    {
        "imports": {
            "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
            "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
        }
    }
    </script>
</head>
<body>
    <canvas id="stage" aria-hidden="true"></canvas>

    <header class="hud-top">
        <h1>Rock <span>·</span> Paper <span>·</span> Scissors</h1>
        <p id="status" class="status" role="status" aria-live="polite">Pick your move</p>
        <p class="score-text" aria-live="polite">
            You <strong id="user-score">{{ score.user_score }}</strong>
            : <strong id="computer-score">{{ score.computer_score }}</strong> Computer
            <span class="draws">Draws <span id="draws">{{ score.draws }}</span></span>
        </p>
    </header>

    <nav class="hud-bottom" aria-label="Your move">
        <button class="choice" type="button" data-choice="rock"><span aria-hidden="true">✊</span> Rock <kbd>1</kbd></button>
        <button class="choice" type="button" data-choice="paper"><span aria-hidden="true">✋</span> Paper <kbd>2</kbd></button>
        <button class="choice" type="button" data-choice="scissors"><span aria-hidden="true">✌️</span> Scissors <kbd>3</kbd></button>
        <button id="reset" class="reset" type="button">Reset <kbd>0</kbd></button>
    </nav>

    <p id="webgl-error" class="webgl-error" hidden>
        Your browser cannot show WebGL. The buttons below still play the game.
    </p>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
