# Rate limits for rps.schemann.dev (MSCH-13). http context: /etc/nginx/conf.d/rps-schemann-dev-ratelimit.conf
# A player needs about one round in four seconds. Writes get 5 per second per IP (burst 20),
# so a class behind one NAT still plays; reads get 20 (burst 60).
limit_req_zone $binary_remote_addr zone=rps_write:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rps_read:1m rate=20r/s;
