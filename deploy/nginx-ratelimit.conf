# Rate limits for rps.schemann.dev (MSCH-13). http context: /etc/nginx/conf.d/rps-schemann-dev-ratelimit.conf
# A player needs about one round in four seconds. Writes get 10 per second per IP (burst 30),
# so a class of 30 behind one NAT still plays at full speed; reads get 20 (burst 60).
limit_req_zone $binary_remote_addr zone=rps_write:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rps_read:1m rate=20r/s;
