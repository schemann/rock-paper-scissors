# Rock Paper Scissors reverse proxy -> docker compose stack in /opt/rock-paper-scissors (MSCH-13).
# The rate-limit zones are defined in deploy/nginx-ratelimit.conf (http context, conf.d).
location ~ ^/(play|reset)$ {
    limit_req zone=rps_write burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1k;
    proxy_read_timeout 30s;
}

location ~ ^/ {
    limit_req zone=rps_read burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1k;
    proxy_read_timeout 30s;
}
